[project]
name = "kanji-katanki"
version = "0.1.0"
description = "Kanji Katanki: offline-first kanji learning add-on for desktop Anki"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pyqt6>=6.6",
    "pytest>=8",
    "pytest-cov>=7.1.0",
    "ruff>=0.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.coverage.run]
branch = true
source = ["katanki", "scripts"]
relative_files = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
