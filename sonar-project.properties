sonar.projectKey=rowan-vr_kanji-katanki
sonar.organization=rowan-vr
sonar.projectName=kanji-katanki
sonar.sources=src,scripts
sonar.tests=tests,scripts
sonar.exclusions=scripts/smoke_*.py
sonar.test.inclusions=tests/**,scripts/smoke_*.py
sonar.sourceEncoding=UTF-8
sonar.python.version=3.12
sonar.python.coverage.reportPaths=coverage.xml

# KanjiVG uses an HTTP XML namespace identifier, never a network endpoint.
# Changing the identifier to HTTPS would stop matching upstream XML attributes.
sonar.issue.ignore.multicriteria=kanjivgNamespace
sonar.issue.ignore.multicriteria.kanjivgNamespace.ruleKey=python:S5332
sonar.issue.ignore.multicriteria.kanjivgNamespace.resourceKey=src/katanki/dictionaries/adapters/kanjivg_svg.py
